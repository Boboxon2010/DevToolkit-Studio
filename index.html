<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevToolkit All-In-One Studio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #0f172a;
      --text-dim: #64748b;
      --border: #e2e8f0;
      --success: #059669;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    
    /* Buttons & Inputs */
    button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover { background: var(--border); }
    
    select, input, textarea { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    
    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); color: var(--text-dim); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    /* Content Panels */
    .panel { display: none; background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .panel.active { display: block; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* API Tester Specifics */
    .api-request-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .api-request-bar select { width: 120px; font-weight: bold; }
    pre { background: var(--bg-color); padding: 15px; border-radius: 8px; overflow-x: auto; max-height: 400px; border: 1px solid var(--border); color: var(--success); font-family: monospace; }

    /* Status badge */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">🚀 DevToolkit Studio <span style="font-size: 0.8rem; color: var(--text-dim);">(Offline Mode)</span></div>
    <div class="header-actions">
      <span id="live-clock" style="font-family: monospace; color: var(--text-dim);">00:00:00</span>
      <button class="secondary" onclick="toggleTheme()" id="theme-btn">🌙 Tungi rejim</button>
    </div>
  </header>

  <!-- Navigatsiya Tablari -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('api-tester')">📡 REST API Tester</button>
    <button class="tab-btn" onclick="switchTab('json-formatter')">🛠 JSON Formatlash</button>
    <button class="tab-btn" onclick="switchTab('encoder-decoder')">🔐 Base64 / URL Kodlagich</button>
    <button class="tab-btn" onclick="switchTab('quick-notes')">📝 Tezkor Bloknot (Auto-Save)</button>
  </div>

  <!-- 1. API TESTER PANEL -->
  <div id="api-tester" class="panel active">
    <h3>API So'rov Yuborish (Fetch HTTP Client)</h3>
    <br>
    <div class="api-request-bar">
      <select id="api-method">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
      </select>
      <input type="text" id="api-url" value="https://jsonplaceholder.typicode.com/todos/1" placeholder="https://api.example.com/v1/resource">
      <button onclick="sendApiRequest()">Yuborish</button>
    </div>

    <div class="grid-2">
      <div>
        <label><b>Request Body (JSON formatida - POST/PUT uchun):</b></label>
        <textarea id="api-body" rows="10" style="margin-top: 5px;" placeholder='{\n  "title": "Yangi vazifa",\n  "completed": false\n}'></textarea>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <label><b>Server Javobi:</b></label>
          <span id="api-status"></span>
        </div>
        <pre id="api-response">// Javob bu yerda ko'rinadi...</pre>
      </div>
    </div>
  </div>

  <!-- 2. JSON FORMATTER PANEL -->
  <div id="json-formatter" class="panel">
    <h3>JSON Validator & Beautifier</h3>
    <br>
    <div class="grid-2">
      <div>
        <textarea id="json-input" rows="14" placeholder="Chalkash yoki xom JSON matnni bu yerga joylang..."></textarea>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
          <button onclick="formatJSON()">Chiroyli qilish (Beautify)</button>
          <button class="secondary" onclick="minifyJSON()">Siqish (Minify)</button>
        </div>
      </div>
      <div>
        <pre id="json-output">// Natija...</pre>
        <div style="margin-top: 10px;">
          <button class="secondary" onclick="copyToClipboard('json-output')">📋 Natijani nusxalash</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. ENCODER / DECODER PANEL -->
  <div id="encoder-decoder" class="panel">
    <h3>Base64 va URL Kodlash / Dekodlash</h3>
    <br>
    <textarea id="encode-input" rows="5" placeholder="Matn kiriting..."></textarea>
    <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
      <button onclick="processText('base64-enc')">Base64 Encode</button>
      <button onclick="processText('base64-dec')">Base64 Decode</button>
      <button class="secondary" onclick="processText('url-enc')">URL Encode</button>
      <button class="secondary" onclick="processText('url-dec')">URL Decode</button>
    </div>
    <textarea id="encode-output" rows="5" readonly placeholder="Natija..."></textarea>
  </div>

  <!-- 4. QUICK NOTES PANEL -->
  <div id="quick-notes" class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3>Avto-saqlanuvchi Kod/Ahamiyatli Qaydlar Bloknoti</h3>
      <button class="secondary" onclick="downloadNotes()">💾 Fayl sifatida yuklab olish (.txt)</button>
    </div>
    <textarea id="notes-area" rows="16" placeholder="Kodingiz, API kalitlaringiz yoki g'oyalaringizni yozing. Saqlash tugmasini bosish shart emas, brauzer hotirasida (LocalStorage) avto-saqlanadi..."></textarea>
  </div>
</div>

<script>
  // 1. Theme Switcher Logic
  function toggleTheme() {
    const body = document.body;
    const isDark = body.getAttribute('data-theme') !== 'light';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-btn').innerText = isDark ? '☀️ Yorug\' rejim' : '🌙 Tungi rejim';
  }

  // 2. Tab Navigation Logic
  function switchTab(tabId) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  // 3. Live Clock
  setInterval(() => {
    document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
  }, 1000);

  // 4. API Tester Function
  async function sendApiRequest() {
    const method = document.getElementById('api-method').value;
    const url = document.getElementById('api-url').value;
    const bodyText = document.getElementById('api-body').value;
    const responsePre = document.getElementById('api-response');
    const statusSpan = document.getElementById('api-status');

    responsePre.innerText = "Yuborilmoqda...";
    statusSpan.innerHTML = '';

    try {
      const options = {
        method: method,
        headers: { 'Content-Type': 'application/json' }
      };

      if ((method === 'POST' || method === 'PUT') && bodyText.trim()) {
        options.body = bodyText;
      }

      const startTime = performance.now();
      const res = await fetch(url, options);
      const endTime = performance.now();
      const duration = Math.round(endTime - startTime);

      const statusClass = res.ok ? 'badge-success' : 'badge-danger';
      statusSpan.innerHTML = `<span class="badge ${statusClass}">${res.status} ${res.statusText} (${duration}ms)</span>`;

      const data = await res.json();
      responsePre.innerText = JSON.stringify(data, null, 2);
    } catch (err) {
      statusSpan.innerHTML = `<span class="badge badge-danger">Xatolik</span>`;
      responsePre.innerText = `Xatolik yuz berdi:\n${err.message}`;
    }
  }

  // 5. JSON Formatter Functions
  function formatJSON() {
    const input = document.getElementById('json-input').value;
    const output = document.getElementById('json-output');
    try {
      const parsed = JSON.parse(input);
      output.innerText = JSON.stringify(parsed, null, 2);
    } catch (e) {
      output.innerText = "❌ Yaroqsiz JSON format: " + e.message;
    }
  }

  function minifyJSON() {
    const input = document.getElementById('json-input').value;
    const output = document.getElementById('json-output');
    try {
      const parsed = JSON.parse(input);
      output.innerText = JSON.stringify(parsed);
    } catch (e) {
      output.innerText = "❌ Yaroqsiz JSON format: " + e.message;
    }
  }

  // 6. Encoder/Decoder Functions
  function processText(type) {
    const input = document.getElementById('encode-input').value;
    const output = document.getElementById('encode-output');
    try {
      if (type === 'base64-enc') output.value = btoa(input);
      if (type === 'base64-dec') output.value = atob(input);
      if (type === 'url-enc') output.value = encodeURIComponent(input);
      if (type === 'url-dec') output.value = decodeURIComponent(input);
    } catch (e) {
      output.value = "❌ Xatolik: " + e.message;
    }
  }

  // 7. LocalStorage Auto-Save Notes
  const notesArea = document.getElementById('notes-area');
  notesArea.value = localStorage.getItem('dev_scratchpad_notes') || '';
  notesArea.addEventListener('input', () => {
    localStorage.setItem('dev_scratchpad_notes', notesArea.value);
  });

  function downloadNotes() {
    const blob = new Blob([notesArea.value], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qaydlar_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
  }

  // Helper Copy Function
  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text);
    alert('Nusxalandi!');
  }
</script>
</body>
</html>
